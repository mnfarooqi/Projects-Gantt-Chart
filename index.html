<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MQSS Projects Interface</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>MQSS Projects</h1>
      <p>Timeline-first project explorer</p>
    </div>
    <div class="top-controls">
      <input id="searchInput" type="search" placeholder="Search title, repo, project..." />
      <select id="sortSelect" aria-label="Sort records" title="Sort records"></select>
      <div class="view-switch" aria-label="View switch">
        <button id="timelineBtn" class="active" data-view="timeline">Timeline</button>
        <button id="tableBtn" data-view="table">Table</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="filters" aria-label="Filters">
      <h2>Filters</h2>
      <label>Project<select id="projectFilter"></select></label>
      <label>Status<select id="statusFilter"></select></label>
      <label>Priority<select id="priorityFilter"></select></label>
      <label>State<select id="stateFilter"></select></label>
      <label>Project order<select id="projectSortSelect"></select></label>
      <button id="resetFilters" class="ghost">Reset</button>
      <section class="stats" id="stats"></section>
      <details class="gh-sync" id="ghSync">
        <summary>Refresh from GitHub</summary>
        <div class="gh-sync-body">
          <label class="gh-sync-label">
            Token
            <input id="ghToken" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false" />
          </label>
          <label class="gh-sync-check">
            <input id="skipClosedProjects" type="checkbox" checked />
            Skip closed projects
          </label>
          <label class="gh-sync-check">
            <input id="skipClosedIssues" type="checkbox" checked />
            Skip closed issues
          </label>
          <button id="refreshBtn" class="gh-load-btn">Load data</button>
          <div id="refreshStatus" class="gh-status"></div>
          <a id="saveDataBtn" class="gh-save-link" download="data.js" hidden>&#8595; Save data.js</a>
          <a id="saveJsonBtn" class="gh-save-link" download="mqss_projects_items.json" hidden>&#8595; Save mqss_projects_items.json</a>
        </div>
      </details>
    </aside>

    <section class="content" id="content" aria-live="polite"></section>
  </main>

  <aside id="detailPanel" class="detail-panel" aria-hidden="true">
    <button id="closeDetail" class="close-detail">Close</button>
    <div id="detailBody"></div>
  </aside>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
